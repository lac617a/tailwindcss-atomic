[package]
name = "tailwind-atomic-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Desactivamos features por defecto para compatibilidad WASM pura
lightningcss = { version = "1.0.0-alpha.58", default-features = false, features = ["visitor"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }